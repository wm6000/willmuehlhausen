name: CI

# The gate, run before merge. deploy.yml runs the same build on push to main, but by
# then a failure means main is already red; this catches it on the pull request.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a PR makes the previous run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Named `check`, not `build`, because branch protection matches required checks by job
  # name and deploy.yml already has a `build`.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Lint (structure rules, parity, tsc, eslint) and then a production build — exactly
      # what deploy.yml will run, so a green PR means a deploy that succeeds.
      - run: npm run build
